[package]
name = "scrollshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Print de área com rolagem (scrolling screenshot) para Linux/X11, com editor de anotações e galeria"
license = "MIT"
repository = "https://github.com/Alessandro-filho/scrollshot"
readme = "README.md"
keywords = ["screenshot", "scrolling", "x11", "linux", "annotation"]
categories = ["multimedia::images", "graphics"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tiny-skia = "0.12.0"
x11rb = { version = "0.14.0", features = ["xtest"] }
